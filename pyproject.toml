[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tem-automation"
version = "0.3.0"
description = "Vendor-independent automation experiments for transmission electron microscopes"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adapters*", "algorithms*", "scripts*"]
namespaces = false
